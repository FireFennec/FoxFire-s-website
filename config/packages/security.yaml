security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    role_hierarchy:
        ROLE_COOKING_ADMIN: ROLE_USER
        ROLE_PERSONAL_SKILL_ADMIN: ROLE_USER
        ROLE_FURRY: ROLE_USER

        ROLE_SUPER_ADMIN:
            - ROLE_USER
            - ROLE_COOKING_ADMIN
            - ROLE_PERSONAL_SKILL_ADMIN
            - ROLE_FURRY

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

            logout:
                path: app_logout

    access_control: []
